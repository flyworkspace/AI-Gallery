<style>
  /* ===== Reset & Base ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface2: #1e1e2e;
    --text: #e0e0f0;
    --text-muted: #8888a8;
    --accent: #c77dff;
    --accent2: #7ec8e3;
    --accent3: #ff6b9d;
    --border: #2a2a3a;
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
    --radius: 12px;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Decorative Background ===== */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(199,125,255,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 20% 80%, rgba(126,200,227,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 30%, rgba(255,107,157,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== Header ===== */
  .header {
    position: relative;
    z-index: 1;
    padding: 26px 32px 24px;
    overflow: hidden;
  }

  /* 横向布局：标题居左、信息与按钮居右，把宽度用满、高度压扁 */
  .header-inner {
    position: relative;
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 22px 40px;
    flex-wrap: wrap;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 15px;
    min-width: 0;
  }

  /* 筛选标签 + 操作按钮同一行，两端对齐，把这一行的宽度也用满 */
  .toolbar {
    position: relative;
    z-index: 1;
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px 26px;
    flex-wrap: wrap;
    padding: 0 32px 26px;
  }

  /* 装饰层：中央光晕 + 细网格，用遮罩把边缘化开，避免生硬 */
  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(ellipse 44% 200% at 50% -25%, rgba(199,125,255,0.17), transparent 70%),
      radial-gradient(ellipse 46% 170% at 6% 50%, rgba(255,107,157,0.07), transparent 72%),
      radial-gradient(ellipse 46% 170% at 94% 50%, rgba(126,200,227,0.08), transparent 72%),
      linear-gradient(rgba(199,125,255,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(199,125,255,0.055) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 100% 100%, 46px 46px, 46px 46px;
    -webkit-mask-image: radial-gradient(ellipse 94% 130% at 50% 0%, #000 42%, transparent 88%);
    mask-image: radial-gradient(ellipse 94% 130% at 50% 0%, #000 42%, transparent 88%);
    pointer-events: none;
  }

  .header > * { position: relative; }   /* 内容压在装饰层之上 */

  .header-icon {
    font-size: 40px;
    line-height: 1;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .header h1 {
    font-size: clamp(23px, 2.5vw, 34px);
    font-weight: 800;
    line-height: 1.2;
    text-align: left;
    background: linear-gradient(135deg, var(--accent), var(--accent3), var(--accent2));
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 6s ease-in-out infinite;
    letter-spacing: -0.02em;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .header .subtitle {
    margin-top: 5px;
    color: var(--text-muted);
    font-size: 11.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-align: left;
  }

  /* ===== Header chips / actions ===== */
  .header-stats {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-left: auto;
  }

  .chip {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: rgba(20,20,31,0.72);
    backdrop-filter: blur(8px);
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    transition: var(--transition);
  }

  .chip b {
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .chip:hover {
    border-color: rgba(199,125,255,0.45);
    color: var(--text);
    transform: translateY(-2px);
  }

  .chip.soft { color: rgba(136,136,168,0.85); }

  .toolbar-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .hero-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 19px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    text-decoration: none;
    transition: var(--transition);
  }

  .hero-btn:hover {
    border-color: var(--accent);
    background: rgba(199,125,255,0.14);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(199,125,255,0.18);
  }

  .hero-btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    border-color: transparent;
    color: #fff;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(199,125,255,0.28);
  }

  .hero-btn.primary:hover { box-shadow: 0 10px 30px rgba(199,125,255,0.42); }

  @media (max-width: 860px) {
    .header { padding: 20px 18px 16px; }
    .header-inner { flex-direction: column; align-items: center; gap: 13px; }
    .header-brand { flex-direction: column; gap: 3px; text-align: center; }
    .header h1, .header .subtitle { text-align: center; }
    .header-icon { font-size: 32px; }
    .header-stats { justify-content: center; margin-left: 0; }
    .toolbar { flex-direction: column; align-items: center; gap: 13px; padding: 0 18px 20px; }
    .filter-bar, .toolbar-actions { justify-content: center; }
    .chip { padding: 5px 12px; font-size: 11.5px; }
    .chip b { font-size: 14px; }
    .hero-btn { padding: 8px 16px; font-size: 12.5px; }
  }

  /* ===== Filter Tags ===== */
  .filter-bar {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: flex-start;
    gap: 10px;
    flex-wrap: wrap;
  }

  .filter-tag {
    padding: 8px 18px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    transition: var(--transition);
    user-select: none;
    white-space: nowrap;
  }

  .filter-tag:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  .filter-tag.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(199,125,255,0.3);
  }

  /* ===== Gallery Grid ===== */
  .gallery {
    position: relative;
    z-index: 1;
    columns: 4;
    column-gap: 16px;
    padding: 0 16px 40px;
    max-width: 1600px;
    margin: 0 auto;
  }

  @media (max-width: 1200px) { .gallery { columns: 3; } }
  @media (max-width: 768px)  { .gallery { columns: 2; column-gap: 10px; padding: 0 10px 32px; } }
  @media (max-width: 480px)  { .gallery { columns: 1; } }

  /* ===== Gallery Card ===== */
  .card {
    break-inside: avoid;
    margin-bottom: 16px;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: var(--transition);
    position: relative;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(199,125,255,0.2);
    border-color: rgba(199,125,255,0.4);
  }

  .card-img-wrap {
    position: relative;
    overflow: hidden;
    background: var(--surface2);
    line-height: 0;
  }

  .card-img-wrap img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    /* Lazy loading placeholder */
    background: var(--surface2);
  }

  .card:hover .card-img-wrap img {
    transform: scale(1.05);
  }

  /* Shimmer loading */
  .card-img-wrap .shimmer {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, var(--surface2) 25%, var(--surface) 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    z-index: 1;
    pointer-events: none;
  }

  .card-img-wrap img.loaded + .shimmer,
  .card-img-wrap img.loaded ~ .shimmer { display: none; }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Card overlay on hover */
  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(10,10,15,0.85) 0%, transparent 50%);
    opacity: 0;
    transition: var(--transition);
    display: flex;
    align-items: flex-end;
    padding: 16px;
    z-index: 2;
    pointer-events: none;
  }

  .card:hover .card-overlay { opacity: 1; }

  .card-overlay .zoom-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    font-size: 40px;
    opacity: 0;
    transition: var(--transition);
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
  }

  .card:hover .card-overlay .zoom-icon {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Card info */
  .card-info {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .card-tag {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 12px;
    background: rgba(199,125,255,0.15);
    color: var(--accent);
    font-weight: 500;
    white-space: nowrap;
  }

  .card-res {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* Placeholder for broken images */
  .card-img-wrap .broken {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 3/4;
    background: var(--surface2);
    color: var(--text-muted);
    font-size: 14px;
    flex-direction: column;
    gap: 8px;
  }

  /* ===== Empty / Loading States ===== */
  .empty-state {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 80px 24px;
    color: var(--text-muted);
  }

  .empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
  .empty-state p { font-size: 14px; max-width: 400px; margin: 0 auto; line-height: 1.8; }
  .empty-state code {
    background: var(--surface2);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
    color: var(--accent2);
    border: 1px solid var(--border);
  }

  /* ===== Lightbox ===== */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(5,5,12,0.95);
    backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;   /* 图片与说明竖排：说明回到正常流，图片再高也压不到它 */
    align-items: center;
    justify-content: center;
    gap: 14px;
    /* 上留关闭按钮、下留计数器 */
    padding: 76px 0 74px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .lightbox.open {
    opacity: 1;
    pointer-events: auto;
  }

  .lightbox-img-wrap {
    position: relative;
    flex: 0 1 auto;
    min-height: 0;            /* 允许收缩，否则会把说明文字顶出屏幕 */
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 90vw;
    /* 可用高度 = 视口 - 上下 padding(76+74) - 间距(14) - 说明文字余量 */
    max-height: calc(100vh - 196px);
  }

  .lightbox-img-wrap img {
    max-width: 90vw;
    max-height: calc(100vh - 196px);
    object-fit: contain;
    border-radius: var(--radius);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    z-index: 1001;
  }

  .lightbox-close:hover {
    background: var(--accent3);
    border-color: var(--accent3);
    color: #fff;
  }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    z-index: 1001;
  }

  .lightbox-nav:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .lightbox-prev { left: 20px; }
  .lightbox-next { right: 20px; }

  @media (max-width: 768px) {
    .lightbox-nav { width: 40px; height: 40px; font-size: 18px; }
    .lightbox-prev { left: 8px; }
    .lightbox-next { right: 8px; }
    .lightbox-close { top: 10px; right: 10px; width: 36px; height: 36px; font-size: 16px; }
    /* 小屏留白收紧，并给可能折成两行的说明文字留余量 */
    .lightbox { padding: 60px 0 64px; gap: 10px; }
    .lightbox-img-wrap,
    .lightbox-img-wrap img { max-height: calc(100vh - 190px); }
  }

  .lightbox-counter {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 16px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 13px;
    z-index: 1001;
  }

  .lightbox-caption {
    /* 回到正常文档流：不再绝对定位，图片多高都不会压到它 */
    position: static;
    flex: 0 0 auto;
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
    z-index: 1001;
    max-width: 80vw;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }

  /* ===== Footer ===== */
  .footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 32px 24px 48px;
    color: var(--text-muted);
    font-size: 13px;
    border-top: 1px solid var(--border);
    margin-top: 20px;
  }

  .footer span { color: var(--accent); }

  /* ===== Scroll to top ===== */
  .scroll-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
  }

  .scroll-top.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .scroll-top:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-3px);
  }

  /* ===== Animations for cards appearing ===== */
  .card {
    opacity: 0;
    animation: fadeInUp 0.5s ease forwards;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== Pagination ===== */
  .pagination {
    position: relative;
    z-index: 1;
    display: none;              /* 只有一页时由 JS 保持隐藏 */
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 24px 44px;
  }

  .page-btn {
    min-width: 38px;
    height: 38px;
    padding: 0 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-muted);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: var(--transition);
    user-select: none;
  }

  .page-btn:hover:not(.disabled):not(.active) {
    border-color: var(--accent);
    color: var(--text);
    transform: translateY(-2px);
  }

  .page-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(199,125,255,0.3);
  }

  .page-btn.disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .page-ellipsis {
    color: var(--text-muted);
    padding: 0 2px;
    user-select: none;
  }

  .page-info {
    margin-left: 6px;
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  @media (max-width: 480px) {
    .page-btn { min-width: 34px; height: 34px; padding: 0 9px; font-size: 13px; }
    .page-info { margin-left: 0; flex-basis: 100%; text-align: center; }
  }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-icon">✨</div>
      <div>
        <h1>二次元 AI 图集</h1>
        <p class="subtitle">AI-Generated Anime Gallery</p>
      </div>

(function() {
  const gallery = document.getElementById('gallery');
  const filterBar = document.getElementById('filterBar');
  const pagination = document.getElementById('pagination');
  const pageSize = document.getElementById('pageSize');
  const emptyState = document.getElementById('emptyState');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCaption = document.getElementById('lightboxCaption');
  const lightboxCounter = document.getElementById('lightboxCounter');
  const totalCount = document.getElementById('totalCount');
  const tagCount = document.getElementById('tagCount');
  const scrollTop = document.getElementById('scrollTop');

  let currentFilter = 'all';
  let currentPage = 1;
  let currentIndex = -1;
  let filteredImages = [];   // 当前分类下的全部图片（跨页，分页只影响渲染）

  const totalPages = () => Math.max(1, Math.ceil(filteredImages.length / PAGE_SIZE));

  // --- 显示顺序 ---
  // IMAGE_LIST 由 generate-config.py 按文件名升序生成（= 生成先后），这里只在渲染时倒序，
  // 好处是数据文件本身保持稳定的升序，diff 干净；想切回旧图在前把 NEWEST_FIRST 改成 false
  const displayList = () => NEWEST_FIRST ? IMAGE_LIST.slice().reverse() : IMAGE_LIST;

  // --- 切换分类：回到第 1 页 ---
  function applyFilter() {
    const source = displayList();
    filteredImages = currentFilter === 'all'
      ? source
      : source.filter(img => img.tag === currentFilter);
    currentPage = 1;
    renderGallery();
  }

  function renderGallery() {
    buildGallery();
    buildPagination();
  }

  // --- 翻页 ---
  function goToPage(page) {
    const target = Math.min(Math.max(1, page), totalPages());
    if (target === currentPage) return;
    currentPage = target;
    renderGallery();
    // 滚到图集顶部，免得上滑时看到空白
    window.scrollTo({
      top: gallery.getBoundingClientRect().top + window.scrollY - 16,
      behavior: 'smooth'
    });
  }

  // --- Build gallery（只渲染当前页）---
  function buildGallery() {
    gallery.innerHTML = '';

    if (filteredImages.length === 0) {
      emptyState.style.display = 'block';
      // Show contextual message
      if (IMAGE_LIST.length === 0) {
        emptyState.querySelector('h3').textContent = '还没有图片';
        emptyState.querySelector('p').innerHTML = '将你的二次元 AI 图片放到 <code>images/</code> 目录下，<br>然后在 <code>IMAGE_LIST</code> 中配置文件名即可。';
      } else {
        emptyState.querySelector('h3').textContent = '没有匹配的图片';
        emptyState.querySelector('p').innerHTML = '尝试选择其他分类标签查看图片。';
      }
      return;
    }

    emptyState.style.display = 'none';

    const start = (currentPage - 1) * PAGE_SIZE;
    const pageImages = filteredImages.slice(start, start + PAGE_SIZE);

    pageImages.forEach((img, idx) => {
      const globalIndex = start + idx;   // 灯箱用全局下标，可在整个分类里连续翻
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = `${Math.min(idx, 12) * 0.04}s`;
      card.setAttribute('data-index', globalIndex);

      const imgPath = `images/${img.file}`;

      card.innerHTML = `
        <div class="card-img-wrap">
          <img src="${imgPath}" alt="${img.caption || img.file}" loading="lazy" />
          <div class="shimmer"></div>
          <div class="card-overlay">
            <span class="zoom-icon">🔍</span>
          </div>
        </div>
        <div class="card-info">
          <span class="card-tag">${img.tag || '未分类'}</span>
          ${img.caption ? `<span class="card-res">${escapeHtml(img.caption)}</span>` : ''}
        </div>
      `;

      // Mark loaded
      const imgEl = card.querySelector('img');
      imgEl.addEventListener('load', () => {
        imgEl.classList.add('loaded');
      });
      imgEl.addEventListener('error', () => {
        // Show broken placeholder
        const wrap = card.querySelector('.card-img-wrap');
        wrap.innerHTML = `<div class="broken"><span>😿</span><span>图片加载失败</span></div>`;
      });

      // Click to open lightbox
      card.addEventListener('click', () => openLightbox(globalIndex));

      gallery.appendChild(card);
    });
  }

  // --- Build pagination ---
  // 页码省略规则：总页数 <= 7 全列出，否则「首页 … 当前±1 … 末页」
  function pageNumbers(current, total) {
    if (total <= 7) {
      return Array.from({ length: total }, (_, i) => i + 1);
    }
    const items = [1];
    const from = Math.max(2, current - 1);
    const to = Math.min(total - 1, current + 1);
    if (from > 2) items.push('...');
    for (let p = from; p <= to; p++) items.push(p);
    if (to < total - 1) items.push('...');
    items.push(total);
    return items;
  }

  function buildPagination() {
    pagination.innerHTML = '';
    const pages = totalPages();

    // 只有一页就不显示分页条
    if (filteredImages.length <= PAGE_SIZE) {
      pagination.style.display = 'none';
      return;
    }
    pagination.style.display = 'flex';

    const addButton = (label, page, opts) => {
      const { active = false, disabled = false, title = '' } = opts || {};
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'page-btn' + (active ? ' active' : '') + (disabled ? ' disabled' : '');
      btn.textContent = label;
      if (title) btn.title = title;
      if (disabled) {
        btn.disabled = true;
      } else {
        btn.addEventListener('click', () => goToPage(page));
      }
      pagination.appendChild(btn);
    };

    addButton('‹', currentPage - 1, { disabled: currentPage === 1, title: '上一页' });

    pageNumbers(currentPage, pages).forEach(item => {
      if (item === '...') {
        const span = document.createElement('span');
        span.className = 'page-ellipsis';
        span.textContent = '…';
        pagination.appendChild(span);
      } else {
        addButton(String(item), item, { active: item === currentPage });
      }
    });

    addButton('›', currentPage + 1, { disabled: currentPage === pages, title: '下一页' });

    const info = document.createElement('span');
    info.className = 'page-info';
    info.textContent = `共 ${filteredImages.length} 张 · 第 ${currentPage} / ${pages} 页`;
    pagination.appendChild(info);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // --- Build filter tags ---
  function buildFilters() {
    const tags = new Set(IMAGE_LIST.map(img => img.tag).filter(Boolean));
    tagCount.textContent = tags.size;
    totalCount.textContent = IMAGE_LIST.length;
    pageSize.textContent = PAGE_SIZE;   // 头部胶囊里的「每页 N 张」跟着配置走

    // Clear existing tags except "全部"
    filterBar.querySelectorAll('.filter-tag:not([data-tag="all"])').forEach(el => el.remove());

    tags.forEach(tag => {
      const span = document.createElement('span');
      span.className = 'filter-tag';
      span.setAttribute('data-tag', tag);
      span.textContent = tag;
      span.addEventListener('click', () => {
        filterBar.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
        span.classList.add('active');
        currentFilter = tag;
        applyFilter();
      });
      filterBar.appendChild(span);
    });

    // "全部" click handler
    const allTag = filterBar.querySelector('[data-tag="all"]');
    allTag.addEventListener('click', () => {
      filterBar.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
      allTag.classList.add('active');
      currentFilter = 'all';
      applyFilter();
    });
  }

  // --- Lightbox ---
  function openLightbox(index) {
    currentIndex = index;
    updateLightbox();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    currentIndex = -1;
  }

  function updateLightbox() {
    if (currentIndex < 0 || currentIndex >= filteredImages.length) return;
    const img = filteredImages[currentIndex];
    lightboxImg.src = `images/${img.file}`;
    lightboxImg.alt = img.caption || img.file;
    lightboxCaption.textContent = img.caption || '';
    lightboxCounter.textContent = `${currentIndex + 1} / ${filteredImages.length}`;

    // 灯箱可以跨页连续翻，翻到别的页时让背后的网格一起跟随，
    // 这样关掉灯箱就停在最后看的那张所在的页
    const pageOfImage = Math.floor(currentIndex / PAGE_SIZE) + 1;
    if (pageOfImage !== currentPage) {
      currentPage = pageOfImage;
      renderGallery();
    }
  }

  function nextImage() {
    if (filteredImages.length === 0) return;
    currentIndex = (currentIndex + 1) % filteredImages.length;
    updateLightbox();
  }

  function prevImage() {
    if (filteredImages.length === 0) return;
    currentIndex = (currentIndex - 1 + filteredImages.length) % filteredImages.length;
    updateLightbox();
  }

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxPrev').addEventListener('click', (e) => { e.stopPropagation(); prevImage(); });
  document.getElementById('lightboxNext').addEventListener('click', (e) => { e.stopPropagation(); nextImage(); });

  // --- 随机看一张（在当前分类范围内随机）---
  document.getElementById('randomBtn').addEventListener('click', () => {
    const pool = filteredImages.length ? filteredImages : displayList();
    if (!pool.length) return;
    openLightbox(Math.floor(Math.random() * pool.length));
  });

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  // --- Keyboard navigation ---
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    switch(e.key) {
      case 'Escape':   closeLightbox(); break;
      case 'ArrowLeft': prevImage(); break;
      case 'ArrowRight': nextImage(); break;
    }
  });

  // --- Touch swipe for lightbox ---
  let touchStartX = 0;
  lightbox.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  });
  lightbox.addEventListener('touchend', (e) => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) {
      diff > 0 ? nextImage() : prevImage();
    }
  });

  // --- Scroll to top ---
  function updateScrollTop() {
    if (window.scrollY > 500) {
      scrollTop.classList.add('visible');
    } else {
      scrollTop.classList.remove('visible');
    }
  }

  window.addEventListener('scroll', updateScrollTop, { passive: true });
  scrollTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // --- Init ---
  function init() {
    buildFilters();
    applyFilter();
    updateScrollTop();
  }

  // Wait for DOM
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
